<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Agents</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="dash.css">
<link rel="stylesheet" href="agents.css">
</head>
<body class="board-page agents-page">
<header class="top">
  <nav id="nav" aria-label="Pages"></nav>
  <h1>Agents</h1>
  <span class="spacer"></span>
  <span id="link" aria-label="Connection"></span>
  <button id="hire-open" type="button" class="primary">+ Hire Agent</button>
</header>

<div class="layout">
  <aside id="side" aria-label="Projects"></aside>
  <main>
    <div id="filters" class="filters" aria-label="Filter by role"></div>
    <div id="warnings"></div>
    <section id="grid" class="grid" aria-label="Agents"></section>
  </main>
</div>

<div id="modal" hidden>
  <form id="hire" class="card" autocomplete="off">
    <h2>Hire Agent</h2>
    <label>Project folder <input id="hire-cwd" type="text" list="hire-projects" placeholder="/Users/you/projects/my-app" required spellcheck="false"></label>
    <datalist id="hire-projects"></datalist>
    <label>Role <select id="hire-role"></select></label>
    <label class="check"><input id="hire-wt" type="checkbox"> Own git worktree <em>(own working copy and branch; needs a git repository)</em></label>
    <label><span>First task <em>(optional)</em></span><textarea id="hire-task" rows="3" placeholder="What should they work on?"></textarea></label>
    <p id="hire-error" role="alert"></p>
    <div class="row"><button type="button" id="hire-cancel">Cancel</button><button type="submit" class="primary">Hire</button></div>
  </form>
</div>

<script src="vendor/xterm/lib/xterm.js"></script>
<script src="vendor/xterm-fit/lib/addon-fit.js"></script>
<script type="module" src="agents.js"></script>
</body>
</html>
